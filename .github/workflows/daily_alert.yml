name: Daily TEFAS Alert

on:
  schedule:
    # TEFAS günlük verisi yayımlandıktan sonra, Türkiye saatiyle 21:30.
    - cron: '30 18 * * *'
  workflow_dispatch: # Manuel tetikleme için

permissions:
  contents: read

env:
  # Node.js 20 deprecation uyarısını gidermek ve Node 24 kullanmak için
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Rebase için tüm geçmiş lazım

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore latest database snapshot
        id: restore-db
        uses: actions/cache/restore@v4
        with:
          path: data/tefas.db
          key: tefas-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tefas-db-${{ runner.os }}-

      - name: Run Daily Alert Job
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          FUND_TYPE: YAT
        run: |
          python run_action.py

      - name: Save database snapshot for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/tefas.db
          key: tefas-db-${{ runner.os }}-${{ github.run_id }}

      - name: Publish database snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tefas-db-${{ github.run_number }}
          path: data/tefas.db
          retention-days: 7
          if-no-files-found: error
